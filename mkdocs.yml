site_name: Logging, Monitoring, and Observability Guide
site_url: https://haapsalu-kutsehariduskeskus.github.io/monitoring/
theme:
  name: material
  features:
  - navigation.tabs
  - navigation.top
  - search.suggest
  - search.highlight
  language: en

markdown_extensions:
- toc:
    permalink: true
- admonition
- codehilite
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.details
- pymdownx.tabbed

plugins:
- search
- git-revision-date-localized:
    fallback_to_build_date: true
- mermaid2

nav:
- Home: index.md

- Fundamentals:
  - Intro to Linux Logging: fundamentals/intro-to-linux-logging.md
