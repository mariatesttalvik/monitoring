site_name: Logging, Monitoring, and Observability Guide
site_url: https://haapsalu-kutsehariduskeskus.github.io/monitoring/
theme:
  name: material
  features:
  - mermaid
  - navigation.tabs
  - navigation.top
  - navigation.expand
  - navigation.sections
  - navigation.indexes
  - navigation.tracking
  - navigation.instant
  - toc.follow
  - toc.sticky
  - search.suggest
  - search.highlight
  - content.tabs.link
  - content.code.copy
  language: en

markdown_extensions:
- toc:
    permalink: true
- admonition
- codehilite
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ""
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.details
- pymdownx.tabbed
- pymdownx.snippets
- pymdownx.keys
- pymdownx.critic
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji ""
    emoji_generator: !!python/name:material.extensions.emoji.to_svg ""

plugins:
- search
- git-revision-date-localized:
    fallback_to_build_date: true

extra_javascript:
- https://unpkg.com/mermaid@10.4.0/dist/mermaid.min.js
- js/extra.js

nav:
- Home: index.md

- Observability:
  - Foundations: materials/lectures/Observability/intro_logging_monitoring_observability.md
  - Wrap-Up: materials/lectures/Observability/wrap-up-observability.md

