site_name: Logging, Monitoring, and Observability Guide
site_url: https://haapsalu-kutsehariduskeskus.github.io/monitoring/
theme:
  name: material
  features:
  # Navigation
  - mermaid
  - navigation.tabs # Top-level sections as tabs
  - navigation.top # Back-to-top button
  - navigation.expand # Left sidebar sections expanded
  - navigation.sections # Render sections as groups
  - navigation.indexes # Section landing pages
  - navigation.tracking # URL updates as you scroll
  - navigation.instant # Instant page loading

  # Table of Contents
  - toc.follow # TOC follows scroll
  - toc.sticky # Keep TOC visible while scrolling

  # Search
  - search.suggest # Search suggestions
  - search.highlight # Highlight search terms

  # Content
  - content.tabs.link # Link tabs together
  - content.code.copy # Add copy button to code blocks

  language: en

markdown_extensions:
- toc:
    permalink: true
- admonition
- codehilite
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true # Line numbers in code blocks
- pymdownx.details
- pymdownx.tabbed
- pymdownx.snippets # Include code snippets
- pymdownx.keys # Keyboard key formatting
- pymdownx.critic # Editorial annotations
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji ""
    emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
plugins:
- search
- git-revision-date-localized:
    fallback_to_build_date: true

extra_javascript:
- https://unpkg.com/mermaid@10.4.0/dist/mermaid.min.js
- js/extra.js

nav:
- Home: index.md

- Observability:
